# Copy to config.yaml (gitignored) and edit for your cluster. Simple key: value.
# AF3 mirror of boltzlis config.example.yaml.
# Generic placeholders only -- never commit real cluster paths or usernames.
#
# Every key below is one the pipeline actually reads. A key it does not read
# is reported as a WARNING on every run (with the nearest real key), so a typo
# can no longer be silently ignored. Older configs used three legacy names --
# infer_gpu_gres, align_extra, infer_extra -- which are still accepted as
# aliases of gpu_gres, af3_data_extra and af3_infer_extra, with a note to
# rename them.

# AF3 module on the cluster. Loaded by both align + infer sbatches.
# Module sets $ALPHAFOLD_BIN_DIR and $ALPHAFOLD_DATABASES for you.
af3_module: bio/alphafold/3.0.1

# User-private (gated) AF3 weights -- request access from DeepMind, install to
# $HOME/af3-models/ (must contain af3.bin.zst). Symlink ok.
model_dir: /path/to/af3-models

# AF3 reference DBs (~628 GB). DEFAULT = the system-wide env-expand the
# bio/alphafold module ships -- matches the current working setup.
# Only override with a user copy if you have a complete mirror.
db_dir: ${ALPHAFOLD_DATABASES}

# Python with numpy+scipy+pandas+matplotlib (for lis.py / collect / plot).
# Your cluster analysis env -- NOT the AF3 module's bundled python.
python: /path/to/conda/envs/analysis/bin/python

# Workspace root on the cluster. JSONs, out/, logs/, msa/ land under here.
workspace: /path/to/scratch/af3_screen

# UniProt FASTA disk cache. Sharing with boltzlis is fine (identical key scheme).
seq_cache: /path/to/seq_cache

# ----- SLURM: alignment stage (CPU MSA + templates) -----
align_partition: cpu-single
# MEASURED on bwHelix (smoke run 14736441, 12 pairs of 76-440 aa chains):
# 15-39 min per pair, mean ~19 min, against the old blind 12:00:00 default.
# Over-asking shrinks backfill eligibility, so this is now 6h -- generous for
# ordinary chains while still leaving headroom, because jackhmmer time tracks
# the NUMBER OF HOMOLOGS FOUND rather than query length and is therefore not
# predictable from the input. Raise it for very long chains (>1500 aa) or
# large families; a task killed on walltime writes no MSA at all.
align_time: 06:00:00
align_mem: 64gb
align_cpus: 16
# Extra flags appended to the alignment stage (e.g. --max_template_date=2024-01-01).
af3_data_extra: ""

# ----- SLURM: inference stage (GPU diffusion) -----
# These settings feed BOTH infer routes: the per-task array (infer.sbatch) and
# packed inference (pack_infer.sbatch; `pipeline.py --pack` after align --
# recommended for big screens on low fairshare; packed jobs get their walltime
# from the pack sizing, not infer_time).
infer_partition: gpu-single
# Fallback --gres for the #SBATCH line. Packed jobs override it per token
# bucket (af3lis/pack.py RESOURCE_LADDER), and that ladder never names a card:
# an unpinned request starts earliest at every size class measured, and
# pinning A100 cost ~2h of queue. Keep this unpinned too.
# NB bwHelix: asking >=64G memory excludes the 26 abundant 40GB gpu4 nodes
# and restricts you to 4 scarce gpu8 nodes -- keep 48-60gb unless needed.
# (There is deliberately no GPU-memory key: gpumem_per_gpu does not influence
# scheduling here, and an old `infer_gpumem` line is ignored with a note.)
gpu_gres: gpu:1
# Bump to 06:00:00 for >2500-residue complexes (large-complex class).
infer_time: 02:00:00
infer_mem: 60gb
infer_cpus: 8
# Unified-memory factor for XLA. >1 enables GPU->host CPU spillover via
# TF_FORCE_UNIFIED_MEMORY=true. 3.2 is the empirical floor for ~3000-residue
# complexes on A100-40GB; 1.5 is plenty for <=1500-residue pairs.
xla_mem_frac: 3.2
# Flash-attention backend: triton | cudnn | xla.
# Note: some A100 firmware miscompiles triton (silent NaN ipTM) -- fall back to
# xla if that happens. cudnn needs cuDNN 9+.
flash_attn: triton
# AF3 --num_diffusion_samples per seed. Total samples per pair = len(seeds) * num_samples.
num_samples: 5
num_recycles: 10
# Extra flags appended to the inference stage.
af3_infer_extra: ""

# ----- AF3 sampling -----
# list[int]; total samples per pair = len(seeds) * num_samples.
# CHANGING THIS REQUIRES REBUILDING JSONS (modelSeeds is baked in stage 1;
# the MSA in the align stage is keyed by the JSON content).
seeds: [1]

# SLURM MaxArraySize for this site. --submit refuses to build an array larger
# than this, because SLURM would reject it and the failure would only surface
# two stages later. Check yours with:
#     scontrol show config | grep MaxArraySize
# The array is sized by CONDITIONS, not conditions x seeds -- seeds are baked
# into each input JSON, so more seeds lengthen each task rather than adding tasks.
max_array_size: 1001

# Public-repo safety: config.yaml is gitignored. Never commit real screen
# target names or cluster usernames here.
